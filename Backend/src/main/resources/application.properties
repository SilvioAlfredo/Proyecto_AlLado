spring.application.name=al_lado_project

# =============================================================================
# Base de datos (AL-SEC-002)
# -----------------------------------------------------------------------------
# La credencial de PostgreSQL NO vive en el repositorio. La contraseña se lee
# de la variable de entorno DB_PASSWORD (obligatoria): si falta, la aplicación
# no arranca, en lugar de seguir con una clave conocida.
#   DB_URL       -> jdbc:postgresql://<host>:<puerto>/<base>
#   DB_USERNAME  -> usuario de la base
#   DB_PASSWORD  -> contraseña de la base
# Copiá el ejemplo de Backend/.env.example y exportá las variables antes de
# iniciar la aplicación.
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/al_lado_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================================================
# Seguridad JWT (AL-SEC-001)
# -----------------------------------------------------------------------------
# El secreto se inyecta desde fuera (JWT_SECRET). No hay valor por defecto:
# una clave conocida en el repositorio permitiría falsificar tokens.
# La clave debe tener al menos 32 bytes (HS256 exige 256 bits).
# =============================================================================
spring.jpa.open-in-view=true
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =============================================================================
# Tokens de un solo uso (AL-SEC-004): recuperación y verificación de correo.
# Cada token declara su propósito, caduca y se consume una única vez.
# =============================================================================
auth.token.recovery.ttl-minutes=${AUTH_RECOVERY_TTL_MINUTES:30}
auth.token.verification.ttl-minutes=${AUTH_VERIFICATION_TTL_MINUTES:1440}

# Valores conservadores también cuando no se carga un perfil.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
