# Perfil E2E / QA automatizado sobre PostgreSQL real.
#
# Es el perfil recomendado: la aplicacion usa bloqueos pesimistas
# (FOR NO KEY UPDATE) que H2 no soporta, por lo que el perfil H2
# (application-e2e-h2.properties) no cubre algunos flujos.
#
# Uso:  java -jar target/al_lado_project-0.0.1-SNAPSHOT.jar --spring.profiles.active=e2e
#
# La base se prepara con:  python3 Testing/e2e/scripts/preparar_base_qa.py
# (carga datos/al_lado_db.sql y fija las contrasenas de las cuentas de rol).

# La base de QA: se puede apuntar a otro puerto/credencial por variable de entorno
# (por ejemplo, el contenedor de PostgreSQL del proyecto escucha en el 5432).
spring.datasource.url=${E2E_DB_URL:jdbc:postgresql://localhost:5433/al_lado_db}
spring.datasource.username=${E2E_DB_USERNAME:postgres}
spring.datasource.password=${E2E_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Secreto de firma SOLO para el perfil de QA: no es una clave real (AL-SEC-001).
# En otros perfiles el valor llega de la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET:clave-qa-e2e-al-lado-solo-para-pruebas-0123456789}

# Puerto alternativo: el 8080 lo usan otros servicios en el entorno de desarrollo.
server.port=${E2E_BACKEND_PORT:8081}
