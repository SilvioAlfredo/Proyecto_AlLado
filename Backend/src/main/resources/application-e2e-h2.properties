# Perfil E2E alternativo sobre H2 en memoria (modo PostgreSQL).
#
# Solo para maquinas sin PostgreSQL. NO cubre los flujos que usan bloqueos
# pesimistas (FOR NO KEY UPDATE), que H2 no implementa: por ejemplo, la creacion
# de oportunidades falla con HTTP 500. Para la suite E2E completa usar el perfil
# 'e2e' (PostgreSQL real).
#
# Uso:  java -jar target/al_lado_project-0.0.1-SNAPSHOT.jar --spring.profiles.active=e2e-h2

spring.datasource.url=jdbc:h2:mem:al_lado_e2e;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:seed-e2e.sql

# El ruido del SQL no aporta en QA: se deja el log de errores de Hibernate.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Secreto de firma SOLO para el perfil de QA: no es una clave real (AL-SEC-001).
# En otros perfiles el valor llega de la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET:clave-qa-e2e-al-lado-solo-para-pruebas-0123456789}

# Puerto alternativo: el 8080 lo usan otros servicios en el entorno de desarrollo.
server.port=${E2E_BACKEND_PORT:8082}
