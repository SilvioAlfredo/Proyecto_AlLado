<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="adminSidebar(activePage)" class="sidebar">
    <div class="sidebar-brand">
        <div class="logo-box">AL</div>
        <div>
            <p class="brand-title">AlLado</p>
            <p class="brand-subtitle">ADMIN</p>
        </div>
    </div>

    <!-- Navegación lateral desktop -->
    <nav class="sidebar-nav">
        <a th:href="@{/admin/dashboard}"
           class="nav-button"
           th:classappend="${activePage == 'dashboard'} ? ' active' : ''">

            <span class="nav-label">Dashboard</span>
        </a>

        <a th:href="@{/admin/contratos}"
           class="nav-button"
           th:classappend="${activePage == 'contratos'} ? ' active' : ''">
            <span class="nav-label">Contratos</span>

        </a>

        <a th:href="@{/admin/comunidad}"
           class="nav-button"
           th:classappend="${activePage == 'comunidad'} ? ' active' : ''">
            <span class="nav-label">Comunidad</span>

        </a>
    </nav>

    <!-- Usuario en sidebar -->
    <div class="sidebar-user">
        <div class="avatar-bubble avatar-gold">AD</div>
        <div>
            <p class="user-name">Admin Central</p>
            <p class="user-role">Moderador</p>
        </div>
    </div>
</aside>
</body>
</html>
