# =============================================================================
# Propiedades SOLO para los tests automatizados.
# -----------------------------------------------------------------------------
# Este archivo sustituye a src/main/resources/application.properties en el
# classpath de test. Los valores de aquí son de prueba: no son secretos
# reales y no sirven fuera de la suite (AL-SEC-001 / AL-SEC-002).
# =============================================================================
spring.application.name=al_lado_project_test

# Base de datos: los tests de integración con base de datos requieren un
# PostgreSQL disponible; sin él los tests que cargan el contexto completo
# fallan (mismo comportamiento que en producción sin DB_PASSWORD).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/al_lado_db_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:clave-de-pruebas}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.open-in-view=true

# Secreto de pruebas: valor ficticio, solo válido dentro de la suite.
jwt.secret=${JWT_SECRET:clave-de-pruebas-solo-para-la-suite-de-tests-0123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

auth.token.recovery.ttl-minutes=30
auth.token.verification.ttl-minutes=1440
