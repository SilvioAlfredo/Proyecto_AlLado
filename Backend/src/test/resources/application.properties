# =============================================================================
# Propiedades SOLO para los tests automatizados.
# -----------------------------------------------------------------------------
# Este archivo sustituye a src/main/resources/application.properties en el
# classpath de test. Los valores de aquí son de prueba: no son secretos
# reales y no sirven fuera de la suite (AL-SEC-001 / AL-SEC-002).
# =============================================================================
spring.application.name=al_lado_project_test

# Base de datos de pruebas: H2 embebido (no requiere PostgreSQL externo).
# Los valores de ${DB_*} se respetan si se definen, pero el por defecto es H2.
spring.datasource.url=${DB_URL:jdbc:h2:mem:al_lado_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.jpa.open-in-view=true

# Flyway se desactiva en tests: sus migraciones (V1__baseline.sql) son de
# PostgreSQL y no son compatibles con H2. Hibernate crea el esquema desde
# las entidades con ddl-auto=create-drop.
spring.flyway.enabled=false

# Secreto de pruebas: valor ficticio, solo válido dentro de la suite.
jwt.secret=${JWT_SECRET:clave-de-pruebas-solo-para-la-suite-de-tests-0123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

auth.token.recovery.ttl-minutes=30
auth.token.verification.ttl-minutes=1440
