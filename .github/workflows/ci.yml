name: CI AlLado

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: al_lado_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d al_lado_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/al_lado_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: test-secret-key-at-least-32-bytes-long-for-ci
      JWT_EXPIRATION: 86400000
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Backend build + tests + coverage
        run: ./mvnw -B verify -Djacoco.coverage.threshold.lines=0.40 -Djacoco.coverage.threshold.instructions=0.40 -Djacoco.coverage.threshold.branches=0.30
        working-directory: Backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: Frontend/al_lado-app

      - name: Lint
        run: npm run lint
        working-directory: Frontend/al_lado-app

      - name: Type check
        run: npx tsc --noEmit
        working-directory: Frontend/al_lado-app

      - name: Tests (vitest)
        run: npm test
        working-directory: Frontend/al_lado-app

      - name: Build
        run: npm run build
        working-directory: Frontend/al_lado-app

      - name: knip (unused dependencies)
        run: npm run knip
        working-directory: Frontend/al_lado-app
